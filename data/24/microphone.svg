<svg
        xmlns='http://www.w3.org/2000/svg'
        xmlns:svg='http://www.w3.org/2000/svg'
        xmlns:gpa='https://www.gtk.org/grappa'
        gpa:version='1'
        gpa:state-names='normal disabled'
        gpa:state='0'
        id='svg1'
        width='24'
        height='24'>
  <g
          id='mask-group'
          mask='url(#disabled-mask)'>
    <path
            id='path1'
            class='foreground foreground-fill'
            opacity='1'
            fill='url(#gpa:foreground) rgb(0,0,0)'
            fill-opacity='1'
            fill-rule='nonzero'
            overflow='visible'
            d='M 12 5 C 10.892 5, 10 5.892, 10 7 L 10 13 C 10 14.108, 10.892 15, 12 15 C 13.108 15, 14 14.108, 14 13 L 14 7 C 14 5.892, 13.108 5, 12 5 Z M 7 10 L 7 11 L 8 11 L 8 13 A 3.981 3.981 0 0 0 11 16.861 L 11 19 L 10 19 L 10 20 L 14 20 L 14 19 L 13 19 L 13 16.861 A 3.981 3.981 0 0 0 16 13 L 16 11 L 17 11 L 17 10 L 15 10 L 15 13 C 15 14.662, 13.662 16, 12 16 C 10.338 16, 9 14.662, 9 13 L 9 10 Z'>
      <animate
              attributeName='opacity'
              begin='StateChange(normal, disabled)'
              dur='200ms'
              repeatCount='1'
              fill='freeze'
              to='0.5'
              keyTimes='0; 1'/>
      <animate
              attributeName='opacity'
              begin='StateChange(disabled, normal)'
              dur='200ms'
              fill='freeze'
              to='1'
              keyTimes='0; 1'/>
    </path>
  </g>
  <line
          id='slash'
          class='transparent-fill'
          visibility='hidden'
          transform='none'
          fill='none'
          stroke='url(#gpa:foreground) rgb(0,0,0)'
          stroke-opacity='1'
          stroke-width='1.25'
          stroke-linecap='round'
          stroke-linejoin='round'
          stroke-miterlimit='4'
          x1='6.045'
          y1='5.42123'
          x2='19.2458'
          y2='18.6085'
          gpa:stroke-minwidth='25%'
          gpa:stroke-maxwidth='200%'
          gpa:stroke='foreground'
          gpa:states='disabled'
          gpa:transition-type='animate'
          gpa:transition-easing='ease-in-out'
          gpa:transition-duration='200ms'>
  </line>
  <mask
          id='disabled-mask'
          opacity='1'>
    <rect
            id='bg'
            class=''
            fill='rgb(255,255,255)'
            x='0'
            y='0'
            width='100%'
            height='100%'>
    </rect>
    <line
            id='slash-clip'
            class=''
            visibility='hidden'
            clip-path='url(#clipPath1)'
            stroke='rgb(0,0,0)'
            stroke-opacity='1'
            stroke-width='1.25'
            stroke-linecap='round'
            stroke-linejoin='round'
            stroke-miterlimit='4'
            x1='6.045'
            y1='7.045'
            x2='19.2458'
            y2='20.23'
            gpa:stroke-minwidth='25%'
            gpa:stroke-maxwidth='200%'
            gpa:states='disabled'
            gpa:transition-type='animate'
            gpa:transition-easing='ease-in-out'
            gpa:transition-duration='200ms'>
    </line>
  </mask>
</svg>
